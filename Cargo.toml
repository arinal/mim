[workspace]
members = ["sdk/rust", "guests/hello_rust", "guests/bounce_rust", "tools/ffigen"]
# what a plain `cargo build` builds: the guests' build targets wasm32v1-none, which ffigen (std) can't
default-members = ["sdk/rust", "guests/hello_rust", "guests/bounce_rust"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR GPL-2.0-only"

[profile.release]
panic = "abort"
opt-level = "s"

[profile.dev]
panic = "abort"
