[workspace]
members = ["sdk/rust", "guests/rust/hello", "guests/rust/bounce", "guests/rust/canvas", "tools/ffigen"]
# what a plain `cargo build` builds: the guests' build targets wasm32v1-none, which ffigen (std) can't
default-members = ["sdk/rust", "guests/rust/hello", "guests/rust/bounce", "guests/rust/canvas"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR GPL-2.0-only"

[profile.release]
panic = "abort"
opt-level = "s"

[profile.dev]
panic = "abort"
