[workspace]
members = ["src/mim/sdk/rust", "src/guests/rust/hello", "src/guests/rust/bounce", "src/guests/rust/canvas", "src/guests/rust/ui", "src/tools/ffigen"]
# what a plain `cargo build` builds: the guests' build targets wasm32v1-none, which ffigen (std) can't
default-members = ["src/mim/sdk/rust", "src/guests/rust/hello", "src/guests/rust/bounce", "src/guests/rust/canvas", "src/guests/rust/ui"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR GPL-2.0-only"

[profile.release]
panic = "abort"
opt-level = "s"

[profile.dev]
panic = "abort"
