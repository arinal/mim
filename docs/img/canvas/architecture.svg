<text x="612.0" y="382.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal" font-style="normal">  PNG -> premultiplied pixels</text>
<text x="612.0" y="400.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal" font-style="normal"></text>
<text x="612.0" y="418.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal" font-style="normal">both end up as calls</text>
<text x="612.0" y="436.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal" font-style="normal">to the rasteriser</text>
