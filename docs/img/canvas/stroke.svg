<circle cx="815.5" cy="139.0" r="4" fill="#c0392b" stroke="none" stroke-width="1"/>
<text x="815.5" y="129.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="normal" font-style="normal">miter tip would be here</text>
<polyline points="441.0,150.0 595.0,150.0 441.0,165.4" fill="none" stroke="#1f2933" stroke-width="1.5" stroke-dasharray="5 4"/>
<circle cx="441.0" cy="150.0" r="3.5" fill="#1f2933" stroke="none" stroke-width="1"/>
<circle cx="595.0" cy="150.0" r="3.5" fill="#1f2933" stroke="none" stroke-width="1"/>
<circle cx="441.0" cy="165.4" r="3.5" fill="#1f2933" stroke="none" stroke-width="1"/>
<text x="430.0" y="88.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="bold" font-style="normal">a very sharp turn, width 1</text>
<text x="430.0" y="106.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#7b8794" text-anchor="start" font-weight="normal" font-style="normal">a miter here would stab far out past the corner</text>
<text x="430.0" y="240.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#d9730d" text-anchor="start" font-weight="bold" font-style="normal">bevel: tip would be 20 x the width (limit 10): just a triangle</text>
<text x="470.0" y="412.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#7b8794" text-anchor="middle" font-weight="normal" font-style="normal">blue = segment rectangles,  green = miter filler,  orange = bevel filler.  One cv_raster_paint fills them all, so overlaps add.</text>
