<rect width="100%" height="100%" fill="#ffffff"/>
<text x="470.0" y="28.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold" font-style="normal">A stroke is a set of polygons: a rectangle per segment, a filler per corner</text>
<polygon points="70.0,160.0 270.0,160.0 270.0,120.0 70.0,120.0" fill="#2f6fb5" fill-opacity="0.22" stroke="#2f6fb5" stroke-width="1.5" stroke-linejoin="round"/>
