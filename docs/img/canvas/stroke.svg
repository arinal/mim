<circle cx="270.0" cy="340.0" r="3.5" fill="#1f2933" stroke="none" stroke-width="1"/>
<text x="50.0" y="58.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="bold" font-style="normal">a right-angle corner, width 1</text>
<text x="50.0" y="76.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#7b8794" text-anchor="start" font-weight="normal" font-style="normal">two rectangles overlap inside and leave a notch outside</text>
<text x="50.0" y="360.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#2b9348" text-anchor="start" font-weight="bold" font-style="normal">miter: tip is 1.41 x the width (limit 10): a full quad</text>
<polygon points="441.0,161.0 595.0,161.0 595.0,139.0 441.0,139.0" fill="#2f6fb5" fill-opacity="0.22" stroke="#2f6fb5" stroke-width="1.5" stroke-linejoin="round"/>
<polygon points="593.9,139.1 439.9,154.5 442.1,176.3 596.1,160.9" fill="#2f6fb5" fill-opacity="0.22" stroke="#2f6fb5" stroke-width="1.5" stroke-linejoin="round"/>
