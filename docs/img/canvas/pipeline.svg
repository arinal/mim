<text x="662.0" y="106.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="start" font-weight="normal" font-style="normal">the current path, device space</text>
<text x="662.0" y="122.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="start" font-weight="normal" font-style="normal">steps 1 and 2 append to it</text>
