<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640">
<defs><marker id="aDown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9730d"/></marker><marker id="aUp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f8b8d"/></marker><marker id="aInk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="aMute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="450.0" y="28.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold" font-style="normal">The fill pipeline, and the data each step touches</text>
<rect x="90.0" y="70.0" width="420.0" height="54.0" fill="#dbe8f6" fill-opacity="1.0" stroke="#2f6fb5" stroke-width="1.5"/>
<text x="104.0" y="94.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#2f6fb5" text-anchor="start" font-weight="bold" font-style="normal">1  transform</text>
<text x="104.0" y="113.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal" font-style="normal">each point to device space</text>
<rect x="90.0" y="154.0" width="420.0" height="54.0" fill="#dbe8f6" fill-opacity="1.0" stroke="#2f6fb5" stroke-width="1.5"/>
