<text x="104.0" y="197.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal" font-style="normal">curves become short lines</text>
<rect x="90.0" y="238.0" width="420.0" height="54.0" fill="#dbe8f6" fill-opacity="1.0" stroke="#2f6fb5" stroke-width="1.5"/>
