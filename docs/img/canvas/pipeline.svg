<text x="104.0" y="449.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal" font-style="normal">per row: running sum -> coverage -> alpha</text>
<rect x="90.0" y="490.0" width="420.0" height="54.0" fill="#fde5cc" fill-opacity="1.0" stroke="#d9730d" stroke-width="1.5"/>
<text x="104.0" y="514.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#d9730d" text-anchor="start" font-weight="bold" font-style="normal">6  blend</text>
