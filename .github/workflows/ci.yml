name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, clang, asan, tsan, valgrind, fuzz]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build valgrind clang clang-format
      - name: format
        if: matrix.preset == 'debug'
        run: git ls-files '*.c' '*.h' | xargs clang-format --dry-run -Werror
      - name: only src/pl and tests may include OS headers
        if: matrix.preset == 'debug'
        run: |
          ! git grep -nE '#include <(pthread|unistd|fcntl|time|sys/)' -- '*.c' '*.h' ':!src/pl' ':!tests'
      - name: allow ThreadSanitizer's memory layout
        # Older TSan runtimes abort with "unexpected memory mapping" when the kernel uses 32 bits
        # of mmap randomisation, as recent Ubuntu does.
        if: matrix.preset == 'tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build build/${{ matrix.preset }}
      - run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure
      - name: fuzz the heap allocator for 60 s
        if: matrix.preset == 'fuzz'
        run: mkdir -p crashes && build/fuzz/tests/fuzz_mem -max_total_time=60 -artifact_prefix=crashes/
      - name: keep the inputs that crashed it
        if: failure() && matrix.preset == 'fuzz'
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: crashes/
