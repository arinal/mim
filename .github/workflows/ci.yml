name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, asan, valgrind]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build valgrind clang-format
      - name: format
        if: matrix.preset == 'debug'
        run: git ls-files '*.c' '*.h' | xargs clang-format --dry-run -Werror
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build build/${{ matrix.preset }}
      - run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure
