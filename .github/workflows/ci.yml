name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # 26.04: the first Ubuntu with SDL3 packaged
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, clang, asan, tsan, valgrind, fuzz]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build valgrind clang clang-format lld libsdl3-dev
      - name: Rust target for the guests
        run: rustup target add wasm32v1-none
      - name: format
        if: matrix.preset == 'debug'
        run: git ls-files '*.c' '*.h' '*.cpp' ':!extern' | xargs clang-format --dry-run -Werror
      - name: the generated import glue matches sdk/mim.ffi
        if: matrix.preset == 'debug'
        run: cargo test --quiet -p ffigen && cargo run --quiet -p ffigen && git diff --exit-code
      - name: only platform/<port> and tests may include OS headers (SDL counts as one)
        if: matrix.preset == 'debug'
        run: |
          ! git grep -nE '#include <(pthread|unistd|fcntl|time|sys/|SDL3/)' -- '*.c' '*.h' ':!platform' ':!tests' ':!extern'
      - name: allow ThreadSanitizer's memory layout
        # Older TSan runtimes abort with "unexpected memory mapping" when the kernel uses 32 bits
        # of mmap randomisation, as recent Ubuntu does.
        if: matrix.preset == 'tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build build/${{ matrix.preset }}
      - run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure
      - name: show what the guests logged
        # test_guest sends stderr there while a guest runs, so a crash's report is only in that file
        if: failure()
        run: cat build/${{ matrix.preset }}/tests/test_guest.log || true
      - name: fuzz the heap allocator for 60 s
        if: matrix.preset == 'fuzz'
        run: mkdir -p crashes && build/fuzz/tests/fuzz_mem -max_total_time=60 -artifact_prefix=crashes/
      - name: keep the inputs that crashed it
        if: failure() && matrix.preset == 'fuzz'
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: crashes/
